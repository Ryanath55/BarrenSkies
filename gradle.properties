# Decompiling Minecraft needs considerably more heap than the MDK default of 1G.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# No system-wide JDK 21 on this machine; this is the Java 21 runtime shipped with the CurseForge launcher.
org.gradle.java.home=C:/Users/Ryana/curseforge/minecraft/Install/runtime/java-runtime-delta/windows-x64/java-runtime-delta

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248
loader_version_range=[1,)

